name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.6
      - run: ruff check .
      - run: ruff format --check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests with coverage
        run: pytest tests/unit --cov --cov-report=term-missing --cov-report=xml

  pipeline-e2e:
    # Full offline run: extract (fixtures) -> transform -> DQ -> load -> dbt build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python scripts/run_local.py --offline

  dag-integrity:
    # Same Airflow/Python versions as Astro Runtime 11.3.0
    runs-on: ubuntu-latest
    env:
      AIRFLOW_VERSION: "2.9.1"
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Airflow with official constraints
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-3.11.txt"
          pip install -r requirements.txt
      - run: pytest tests/dags
