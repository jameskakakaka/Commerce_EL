fakeshop_dbt:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Same warehouse the Airflow loader writes to. DUCKDB_PATH is set by the
      # container / run_local script; the default works when run from this folder.
      path: "{{ env_var('DUCKDB_PATH', '../warehouse/fakeshop.duckdb') }}"
      threads: 1
