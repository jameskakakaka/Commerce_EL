version: 2

sources:
  - name: raw_data
    description: "Raw layer written by the Airflow load DAG (include/tasks/load/duckdb_load.py)"
    schema: main
    tables:
      - name: transactions
        description: "One row per cart line item from the FakeStore API"
        columns:
          - name: transaction_id
            tests: [unique, not_null]
          - name: transaction_date
            tests: [not_null]
          - name: user_id
            tests: [not_null]
          - name: total_amount
            tests: [not_null]
          - name: sale_tier
            tests:
              - accepted_values:
                  arguments:
                    values: ['High Value', 'Standard']
