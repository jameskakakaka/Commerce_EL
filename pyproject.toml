[project]
name = "fakeshop-pipeline"
version = "1.0.0"
description = "Airflow + DuckDB + dbt ELT pipeline for FakeStore API e-commerce data"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["include"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["fakeshop_dbt", "infra", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["include"]
